<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 482 44" width="482" height="44">
  <rect x="0" y="0" width="482" height="44" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- NICs: 2x2 grid far left -->
  <rect x="12" y="8" width="16" height="10" rx="2" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1"/>
  <text x="20" y="15" text-anchor="middle" fill="#0f172a" font-size="5">NIC1</text>
  <rect x="12" y="20" width="16" height="10" rx="2" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1"/>
  <text x="20" y="27" text-anchor="middle" fill="#0f172a" font-size="5">NIC2</text>
  <rect x="32" y="8" width="16" height="10" rx="2" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1"/>
  <text x="40" y="15" text-anchor="middle" fill="#0f172a" font-size="5">NIC3</text>
  <rect x="32" y="20" width="16" height="10" rx="2" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1"/>
  <text x="40" y="27" text-anchor="middle" fill="#0f172a" font-size="5">NIC4</text>
  <!-- USB: stacked below NICs -->
  <rect x="12" y="32" width="14" height="6" rx="1" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
  <text x="19" y="37" text-anchor="middle" fill="#0f172a" font-size="4">USB</text>
  <rect x="12" y="39" width="14" height="5" rx="1" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
  <text x="19" y="43" text-anchor="middle" fill="#0f172a" font-size="4">USB</text>
  <!-- PSUs: side by side far right -->
  <rect x="400" y="24" width="28" height="14" rx="2" fill="#fb923c" stroke="#ea580c" stroke-width="1"/>
  <text x="414" y="34" text-anchor="middle" fill="#0f172a" font-size="5">PSU1</text>
  <rect x="432" y="24" width="28" height="14" rx="2" fill="#fb923c" stroke="#ea580c" stroke-width="1"/>
  <text x="446" y="34" text-anchor="middle" fill="#0f172a" font-size="5">PSU2</text>
</svg>
