name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        # Dense-layout tests include a wall-clock performance budget. Avoid
        # competing test files consuming the runner CPU during that measurement.
        run: npm test -- --no-file-parallelism

      - name: Run plugin tests
        run: npm run test:plugins

      - name: Build production bundle
        run: npm run build

      - name: Check eager bundle budget
        run: node scripts/check-bundle-size.mjs

      - name: Install Chromium
        if: matrix.node-version == '22.x'
        run: npx playwright install --with-deps chromium

      - name: Test production browser workflows
        if: matrix.node-version == '22.x'
        run: npx playwright test
        env:
          PLAYWRIGHT_PRODUCTION: '1'

      - name: Upload production bundle
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
